<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>vskills webapp</title>
    <style>
      body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 24px; }
      fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
      legend { font-weight: 600; }
      .field-description { margin-top: 0; color: #444; }
      .option-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
      .swatch { display: inline-block; width: 20px; height: 20px; border-radius: 4px; border: 1px solid #ccc; }
      textarea { width: 100%; box-sizing: border-box; }
      .diff-item { border: 1px solid #eee; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
      .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .diff-block { max-height: 240px; overflow-y: auto; padding: 8px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; font-size: 13px; }
      .diff-before { background: #fdecea; }
      .diff-after { background: #e9f7ef; }
      .diff-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="root">
      <p>Waiting for the next step...</p>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
